<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#fff8e7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comboio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>VanBerto's Comboio 🚂</title>
<link rel="preload" href="fonts/fredoka-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Fredoka One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/fredoka-one-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:'Nunito';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:'Nunito';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/nunito-latin-900-normal.woff2) format('woff2');}
:root{--ink:#1e1b4b;--sun:#ffd23f;--coral:#ff6b6b;--mint:#2ee6a6;--sky:#4cc9f0;--grape:#7c3aed;--cream:#fff8e7;--gold:#FFD600;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--cream);}
body{
  min-height:100vh;min-height:100dvh;display:flex;padding:clamp(10px,3vw,24px);
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background-color:var(--cream);
  background-image:radial-gradient(rgba(255,150,60,.30) 1.4px,transparent 1.6px);background-size:22px 22px;
}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes drive{0%{left:102%}100%{left:-34%}}
@keyframes puff{0%{opacity:.7;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(14px,-22px) scale(1.4)}}
@keyframes vbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes vbBubbleIn{0%{opacity:0;transform:scale(.6) translateY(6px)}60%{opacity:1;transform:scale(1.08) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}

.wrap{position:relative;z-index:1;width:min(660px,100%);margin:auto;}
@media(min-width:700px){.wrap{width:min(860px,100%);}}
.card{background:#fff;border:3px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 6px 0 var(--ink);}

/* ── HERO ── */
.hero{text-align:center;padding:clamp(16px,4vw,24px) clamp(14px,4vw,28px) clamp(12px,3vw,18px);
  background:linear-gradient(#fff,var(--cream));border-bottom:3px solid var(--ink);}
.hero-icon{width:clamp(48px,12vw,60px);height:clamp(48px,12vw,60px);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(24px,6.5vw,32px);line-height:1;background:var(--sun);border:3px solid var(--ink);border-radius:50%;box-shadow:0 4px 0 var(--ink);}
.title{font-family:'Fredoka One',cursive;font-weight:400;font-size:clamp(26px,7vw,42px);color:var(--ink);line-height:1.1;}
.sub{margin-top:4px;color:var(--grape);font-size:clamp(10px,2.6vw,13px);font-weight:900;letter-spacing:1.2px;text-transform:uppercase;}
.hero-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px;}
.stat-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:20px;white-space:nowrap;
  font-family:'Fredoka One',cursive;font-size:clamp(11px,3vw,13px);color:var(--ink);background:var(--sun);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);}
.stat-badge:nth-child(2){background:var(--mint);}
.stat-badge:nth-child(3){background:var(--sky);}
.stat-badge:nth-child(4){background:#ffb3b3;}
/* continuar */
.resume{display:none;margin:14px auto 0;max-width:420px;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:var(--ink);
  font-family:'Fredoka One',cursive;font-size:clamp(14px,4vw,17px);padding:10px 22px;border-radius:50px;
  background:var(--sun);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;}
.resume.on{display:flex;}
.resume:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink);}
.resume:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.resume:focus-visible{outline:3px solid var(--grape);outline-offset:3px;}
.resume small{font-family:'Nunito',sans-serif;font-weight:900;font-size:.68em;letter-spacing:.8px;text-transform:uppercase;opacity:.8;}

/* ── JOGOS ── */
.games{padding:clamp(14px,3vw,20px) clamp(12px,3vw,20px) clamp(16px,3vw,22px);}
.games-label{display:flex;align-items:center;gap:10px;font-family:'Fredoka One',cursive;font-weight:400;color:var(--ink);font-size:clamp(12px,3vw,14px);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:14px;}
.games-label::before,.games-label::after{content:'';flex:1;border-top:3px dotted rgba(30,27,75,.28);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-height:480px) and (orientation:landscape){.grid{grid-template-columns:repeat(4,1fr);}}

.game{
  --gc:#fff;--gg:rgba(255,255,255,.3);
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 8px 12px;border-radius:18px;text-align:center;text-decoration:none;color:inherit;min-height:44px;
  background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);
  opacity:0;animation:rise .45s calc(var(--i)*70ms + 120ms) cubic-bezier(.2,.8,.2,1) forwards;
  transition:transform .08s,box-shadow .08s;
}
.game::before{content:'';position:absolute;inset:0;background:var(--gc);opacity:.14;pointer-events:none;transition:opacity .2s;}
.game>*{position:relative;}
.game:hover,.game:focus-visible{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink);outline:none;}
.game:hover::before,.game:focus-visible::before{opacity:.26;}
.game:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
.game:focus-visible{outline:3px solid var(--grape);outline-offset:3px;}
.bubble{position:relative;width:clamp(52px,14vw,64px);height:clamp(52px,14vw,64px);border-radius:16px;display:grid;place-items:center;
  font-size:clamp(26px,7.5vw,34px);line-height:1;background:var(--gc);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .2s;}
.game:hover .bubble,.game:focus-visible .bubble{transform:scale(1.1) rotate(-5deg);}
.name{font-family:'Fredoka One',cursive;font-size:clamp(12px,3.2vw,14.5px);line-height:1.15;color:var(--ink);}
.desc{font-size:clamp(10px,2.6vw,11.5px);font-weight:700;line-height:1.3;color:#4a4872;}
.play{margin-top:auto;font-family:'Fredoka One',cursive;font-size:11.5px;letter-spacing:.4px;padding:2px 12px;border-radius:20px;color:#fff;
  background:var(--gc);border:2px solid var(--ink);text-shadow:0 1px 0 rgba(30,27,75,.65);}
.prog{width:100%;margin-top:4px;display:flex;flex-direction:column;gap:3px;align-items:center;}
.prog-bar{width:82%;height:10px;border-radius:6px;background:#fff;border:2px solid var(--ink);overflow:hidden;}
.prog-bar i{display:block;height:100%;background:var(--gc);}
.prog-txt{font-family:'Fredoka One',cursive;font-size:10.5px;letter-spacing:.3px;color:var(--ink);}
.prog-txt.done{color:#b45309;}
.new{font-size:10.5px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:#4a4872;margin-top:4px;}
.last{position:absolute;top:6px;right:6px;z-index:2;font-size:9px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;
  background:var(--sun);color:var(--ink);border:2px solid var(--ink);padding:1px 7px;border-radius:10px;}

/* ── RODAPÉ com o comboio do jogo ── */
.track{position:relative;height:clamp(104px,20vw,140px);overflow:hidden;border-top:3px solid var(--ink);background:linear-gradient(#e9f6ff,var(--cream) 78%);}
.track canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;background:#fff;border-top:3px solid var(--ink);
  font-family:'Fredoka One',cursive;font-size:12px;letter-spacing:.5px;color:var(--ink);}
.footer span{background:#fff;border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);border-radius:999px;padding:1px 12px;}

/* ── VanBerto's (canto do ecrã, como na Central de Missões) ── */
.vb-free{position:fixed;right:clamp(10px,3vw,30px);bottom:clamp(10px,3vw,26px);--vbw:clamp(64px,12vw,96px);width:var(--vbw);z-index:50;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;}
.vb-free canvas{display:block;width:100%;height:auto;animation:vbFloat 3s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(30,27,75,.35));}
.vb-free-name{font-family:'Fredoka One',cursive;font-size:clamp(.6rem,1.6vw,.72rem);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 8px;
  box-shadow:0 2px 0 var(--ink);text-align:center;line-height:1.3;white-space:nowrap;}
.vb-free-bubble{--bc:#dcebff;position:absolute;bottom:calc(100% + 6px);right:-6px;width:max-content;max-width:min(230px,calc(100vw - 28px));
  background:linear-gradient(135deg,var(--bc),#fff);border:3px solid var(--ink);outline:2px solid #2d2a66;outline-offset:-4px;border-radius:16px;padding:7px 12px 6px;
  font-family:"Comic Sans MS","Trebuchet MS",sans-serif;font-weight:bold;color:#0f172a;font-size:clamp(.72rem,2.4vw,.88rem);text-align:center;line-height:1.3;
  box-shadow:3px 3px 0 var(--ink);transform-origin:80% 100%;}
.vb-free-bubble.hide{opacity:0;transform:translateY(8px) scale(.88);transition:opacity .35s ease,transform .35s ease;}
.vb-free-bubble.pop{animation:vbBubbleIn .45s cubic-bezier(.34,1.56,.64,1) 1;}
.vb-free-bubble::after{content:"";position:absolute;bottom:-14px;right:calc(var(--vbw)/2 - 4px);border-left:10px solid transparent;border-right:10px solid transparent;border-top:14px solid var(--ink);}
.vb-free-bubble::before{content:"";position:absolute;bottom:-9px;right:calc(var(--vbw)/2 - 2px);border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid var(--bc);z-index:1;}
/* espaço para o VanBerto's não tapar o fim da página */
body{padding-bottom:clamp(120px,24vw,180px);}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important;}
  .game{opacity:1;}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">

    <header class="hero">
      <div class="hero-icon" aria-hidden="true">🚂</div>
      <h1 class="title">VanBerto's Comboio</h1>
      <p class="sub">Aprende a brincar • Escolhe o teu jogo</p>
      <div class="hero-stats"><span class="stat-badge">🎯 Aprender</span><span class="stat-badge">🧠 Pensar</span><span class="stat-badge">🎈 Brincar</span><span class="stat-badge">⭐ Ganhar</span></div>

      <a class="resume" id="resume" href="#" target="_blank" rel="noopener"><small>Continuar</small><span id="resumeName"></span> ▶</a>
    </header>

    <section class="games" aria-labelledby="gl">
      <h2 class="games-label" id="gl">🎮 <span id="count">8</span> jogos disponíveis</h2>
      <nav class="grid" id="grid" aria-label="Jogos"></nav>
    </section>

    <div class="track" aria-hidden="true"><canvas id="trainCv"></canvas></div>
    <footer class="footer">
      <span>© Prof.ª Vanda Várzea</span>
      <span>VanBerto's</span>
    </footer>

  </div>
</main>

<div class="vb-free" id="vbFree">
  <div class="vb-free-bubble pop" id="vbFreeMsg">Olá! Sou o VanBerto's 🤖<br>Escolhe um jogo para brincar!</div>
  <canvas id="vbFreeCv" width="288" height="288" role="img" aria-label="VanBerto's, o robô amigo"></canvas>
  <div class="vb-free-name">VanBerto's</div>
</div>
<script>
const GAMES=[
  {id:'cores',k:'cores',    e:'🎈',n:'Jogo das Cores',      d:'Aprende as cores',          c:'#E91E63',u:'https://vvarzea.github.io/VanBerto-s-Comboio-JogodasCores/'},
  {id:'animais',k:'animais',  e:'🦁',n:'Jogo dos Animais',    d:'Descobre os animais',       c:'#4CAF50',u:'https://vvarzea.github.io/VanBerto-s-Comboio-Animais-Jogo/'},
  {id:'numeros',k:'numeros',  e:'🔢',n:'Jogo dos Números',    d:'Conta de 1 a 20',           c:'#2196F3',u:'https://vvarzea.github.io/VanBerto-s-Comboio-Numeros-Jogo/'},
  {id:'frutas',k:'frutas',   e:'🍎',n:'Jogo das Frutas',     d:'Conhece as frutas',         c:'#FF9800',u:'https://vvarzea.github.io/VanBerto-s-Comboio-Frutas-Jogo/'},
  {id:'profissoes',k:'profissoes',e:'👨‍⚕️',n:'Jogo das Profissões',d:'O que fazem as pessoas?',   c:'#9C27B0',u:'https://vvarzea.github.io/VanBerto-s-Comboio-das-Profissoes/'},
  {id:'veiculos',k:'veiculos', e:'🚗',n:'Jogo dos Veículos',   d:'Carros, aviões e barcos',   c:'#00BCD4',u:'https://vvarzea.github.io/VanBerto-s-Comboio-Veiculos-Jogo/'},
  {id:'alfabeto',k:'letras', e:'🔤',n:'Alfabeto Fotográfico',d:'As letras com imagens',     c:'#F44336',u:'https://vvarzea.github.io/Vanberto-s-Comboio-Alfabeto-Fotrografico/'},
  {id:'planetas',k:'planetas', e:'🪐',n:'Jogo dos Planetas',   d:'Viaja pelo sistema solar',  c:'#3F51B5',u:'https://vvarzea.github.io/VanBerto-s-Comboio-Planetas-/'}
];
const KEY='vb_ultimo_jogo';
const store={get(){try{return localStorage.getItem(KEY)}catch(e){return null}},set(v){try{localStorage.setItem(KEY,v)}catch(e){}}};
const hex=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;};
const grid=document.getElementById('grid'),last=store.get();
const MAXLVL=20;
// cada jogo guarda "jogo_<tema>_lvl" (nível mais alto) e "jogo_<tema>_rec" (recorde) no mesmo site, por isso o menu consegue lê-los
function progress(g){
  try{
    const l=localStorage.getItem('jogo_'+g.k+'_lvl'),r=localStorage.getItem('jogo_'+g.k+'_rec');
    if(l===null&&r===null)return null;
    return {lvl:Math.min(MAXLVL,Math.max(1,parseInt(l||'1',10)||1)),rec:parseInt(r||'0',10)||0};
  }catch(e){return null;}
}
const fmt=n=>n.toLocaleString('pt-PT');

function progHtml(g){
  const p=progress(g);
  if(!p)return '<div class="new">Ainda não jogaste</div>';
  const done=p.lvl>=MAXLVL;
  return `<div class="prog"><div class="prog-bar" role="progressbar" aria-valuemin="1" aria-valuemax="${MAXLVL}" aria-valuenow="${p.lvl}"><i style="width:${Math.round(p.lvl/MAXLVL*100)}%"></i></div>`+
    `<div class="prog-txt${done?' done':''}">${done?'🏆 Completo!':'Nível '+p.lvl+' de '+MAXLVL}${p.rec?' · ⭐ '+fmt(p.rec):''}</div></div>`;
}
GAMES.forEach((g,i)=>{
  const a=document.createElement('a');
  a.className='game';a.href=g.u;a.target='_blank';a.rel='noopener';a.dataset.id=g.id;
  a.style.cssText=`--gc:${g.c};--gg:${hex(g.c,.45)};--i:${i}`;
  a.setAttribute('aria-label',`${g.n}: ${g.d}`);
  a.innerHTML=(g.id===last?'<span class="last">⭐ Último</span>':'')+
    `<div class="bubble"><span>${g.e}</span></div><div class="name">${g.n}</div><div class="desc">${g.d}</div>`+progHtml(g)+`<div class="play">${progress(g)?'Continuar':'Jogar'} ▶</div>`;
  a.addEventListener('click',()=>store.set(g.id));
  grid.appendChild(a);
});
document.getElementById('count').textContent=GAMES.length;
{const started=GAMES.filter(g=>progress(g)).length;
 if(started)document.getElementById('gl').innerHTML='🎮 '+GAMES.length+' jogos • '+started+' já começado'+(started>1?'s':'');}
let pname='';try{pname=(localStorage.getItem('ja_playerName')||'').trim();}catch(e){}

const lg=GAMES.find(g=>g.id===last);
if(lg){const r=document.getElementById('resume');r.href=lg.u;r.classList.add('on');
  document.getElementById('resumeName').textContent=lg.e+' '+lg.n;
  r.addEventListener('click',()=>store.set(lg.id));}


// ── VanBerto's (novo): robô do puzzle, a piscar e a marchar ──
function rrVan(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();
}
function cfVan(ctx,x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}

function drawVBPuzzle(ctx,blink,step,armsUp){
  const w=96,h=96;
  ctx.clearRect(0,0,w,h);
  ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.save(); ctx.translate(0,6);
  const NAVY="#16233e", NAVY2="#26365a", OUT="#101a30";
  function white(x0,y0,x1,y1){const g=ctx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,"#ffffff");g.addColorStop(0.55,"#e6edf7");g.addColorStop(1,"#b4c4dc");return g;}

  const LIFT=8, STRIDE=3;
  let lTop=70, rTop=70, lDX=0, rDX=0;
  if(step===0){ lTop=70-LIFT; lDX=STRIDE; rDX=-STRIDE; }
  else if(step===1){ rTop=70-LIFT; rDX=STRIDE; lDX=-STRIDE; }
  function leg(cx,top){
    rrVan(ctx,cx-5,top,10,11,4.5); ctx.fillStyle=white(cx-5,top,cx+5,top); ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle=OUT; ctx.stroke();
    const fy=top+9;
    rrVan(ctx,cx-6.5,fy,13,9,4); ctx.fillStyle=NAVY; ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle=OUT; ctx.stroke();
    rrVan(ctx,cx-6.5,fy+2,13,2.4,1.2); ctx.fillStyle="rgba(255,255,255,0.85)"; ctx.fill();
    cfVan(ctx,cx-2.5,fy+4.5,1.4,"rgba(255,255,255,0.5)");
  }
  leg(41+lDX,lTop); leg(55+rDX,rTop);

  const ARM_SWING = 0.24;
  const JUMP_RAISE = 2.9;
  let lArmSwing = 0, rArmSwing = 0;
  if(armsUp){ lArmSwing = JUMP_RAISE; rArmSwing = -JUMP_RAISE; }
  else if(step===0){ lArmSwing=-ARM_SWING; rArmSwing=ARM_SWING; }
  else if(step===1){ lArmSwing=ARM_SWING; rArmSwing=-ARM_SWING; }
  function arm(sx,swing){
    ctx.save();
    const px=sx+4.5, py=52;
    ctx.translate(px,py); ctx.rotate(swing); ctx.translate(-px,-py);
    rrVan(ctx,sx,52,9,13,4.5); ctx.fillStyle=white(sx,52,sx+9,52); ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle=OUT; ctx.stroke();
    const hx=sx+4.5, hy=67;
    cfVan(ctx,hx,hy,5,NAVY);
    ctx.lineWidth=2.3; ctx.strokeStyle=OUT; ctx.beginPath(); ctx.arc(hx,hy,5,0,Math.PI*2); ctx.stroke();
    cfVan(ctx,hx-2,hy+1.6,1.4,NAVY2); cfVan(ctx,hx+0.5,hy+2.4,1.4,NAVY2); cfVan(ctx,hx+2.5,hy+1.6,1.4,NAVY2);
    ctx.restore();
  }
  arm(17,lArmSwing); arm(70,rArmSwing);

  rrVan(ctx,26,44,44,32,15); ctx.fillStyle=white(28,46,68,46); ctx.fill();
  ctx.save(); rrVan(ctx,26,44,44,32,15); ctx.clip();
  const wg=ctx.createLinearGradient(0,64,0,76); wg.addColorStop(0,"rgba(22,35,62,0)"); wg.addColorStop(0.4,"#1c2c4c"); wg.addColorStop(1,"#142038");
  ctx.fillStyle=wg; ctx.fillRect(26,62,44,16);
  ctx.strokeStyle="rgba(16,26,48,0.6)"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(28,64); ctx.lineTo(68,64); ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.beginPath(); ctx.ellipse(36,52,9,5.5,-0.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.lineWidth=3; ctx.strokeStyle=OUT; rrVan(ctx,26,44,44,32,15); ctx.stroke();

  cfVan(ctx,48,56,8,NAVY);
  ctx.lineWidth=2.5; ctx.strokeStyle=OUT; ctx.beginPath(); ctx.arc(48,56,8,0,Math.PI*2); ctx.stroke();

const _vbFrames={};
function vbFrame(blink,step,armsUp){
  const k=String(blink)+'|'+step+'|'+(armsUp?1:0);
  if(_vbFrames[k])return _vbFrames[k];
  const c=document.createElement('canvas');c.width=288;c.height=288;
  const g3=c.getContext('2d');g3.scale(3,3);drawVBPuzzle(g3,blink,step,armsUp);
  return _vbFrames[k]=c;
}

  trainWheel(x+L*0.10,cs,rs,wheelAngle*1.6,'#d8392b');trainWheel(x+L*0.88,cs,rs,wheelAngle*1.6,'#d8392b');
  trainWheel(w1,cy,r,wheelAngle,'#d8392b');trainWheel(w2,cy,r,wheelAngle,'#d8392b');
  const p1=[w1+Math.cos(wheelAngle)*pr,cy+Math.sin(wheelAngle)*pr],p2=[w2+Math.cos(wheelAngle)*pr,cy+Math.sin(wheelAngle)*pr];
  rod(p1[0],p1[1],p2[0],p2[1]);rod(x+L*0.74,y-L*0.125,p2[0],p2[1]);
  [p1,p2].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],S(2.2),0,7);ctx.fillStyle=BR2;ctx.fill();});
}
  function drawWagon(w,i){
  if(wagonShakes[i]>0)wagonShakes[i]=Math.max(0,wagonShakes[i]-0.08);
  if(wagonJumps[i]>0)wagonJumps[i]=Math.max(0,wagonJumps[i]-0.07);
  // FIX: shake e jump suaves (sem tremido)
  const shakeOff=wagonShakes[i]>0?Math.sin(wagonShakes[i]*Math.PI*3)*S(1.5)*wagonShakes[i]:0;
  const jumpOff=wagonJumps[i]>0?-Math.sin(wagonJumps[i]*Math.PI)*S(8)*wagonJumps[i]:0;
  const x=w.x+shakeOff,y=RAIL_Y+jumpOff;
  if(w.x<-WW-S(10)||w.x>W+S(10))return;
  if(!w.filled&&w.fillAnim>0)w.fillAnim=0;
  if(w.filled&&w.fillAnim<1)w.fillAnim=Math.min(1,w.fillAnim+0.06);
  const locked=difficulty==='easy'&&!w.filled&&!wagonUnlocked(i);
  const GOLD='#c8952a',GOLD2='#f0c040',GOLD3='#8a6010';
  const BRD=WH*0.10,WIN_Y=y-WH+BRD*1.1,WIN_H=WH*0.46,WIN_W=WW*0.80,WIN_X=x+(WW-WIN_W)/2,NAME_Y=WIN_Y+WIN_H+WH*0.06,PLAT_Y=y-WH*0.18;
  ctx.save();ctx.globalAlpha=0.3;ctx.beginPath();ctx.ellipse(x+WW/2,y+S(5),WW*0.48,S(7),0,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();ctx.restore();
  if(!w.filled&&!locked){ctx.save();ctx.shadowColor=w.color.h;ctx.shadowBlur=S(18);ctx.beginPath();ctx.roundRect(x-S(3),y-WH-S(6),WW+S(6),WH+S(5),S(8));ctx.strokeStyle=w.color.h;ctx.lineWidth=S(2.5);ctx.stroke();ctx.restore();}
  const wDark=w.filled?'#2a5a1a':locked?'#1e1510':'#5a3010',wMid=w.filled?'#336622':locked?'#28190e':'#7a4418',wLight=w.filled?'#3d7a28':locked?'#321e12':'#9a5820';
  const bodyH=PLAT_Y-(y-WH);
const bg=ctx.createLinearGradient(x,y-WH,x,PLAT_Y);bg.addColorStop(0,wLight);bg.addColorStop(0.45,wMid);bg.addColorStop(1,wDark);
rrFill(x,y-WH,WW,bodyH,S(4),bg);
ctx.save();ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=Math.max(1,S(1));
for(let k=1;k<9;k++){const px=x+WW*k/9;ctx.beginPath();ctx.moveTo(px,y-WH+BRD);ctx.lineTo(px,PLAT_Y);ctx.stroke();}
ctx.restore();
const rg=ctx.createLinearGradient(0,y-WH-S(7),0,y-WH+BRD);rg.addColorStop(0,'#5b5f6b');rg.addColorStop(0.5,'#33353d');rg.addColorStop(1,'#1c1d22');
rrFill(x-S(3),y-WH-S(6),WW+S(6),BRD+S(7),S(5),rg);
ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(x+S(2),y-WH-S(5),WW-S(4),S(1.4));
ctx.fillStyle=GOLD;ctx.fillRect(x,y-WH+BRD,WW*0.04,bodyH-BRD);ctx.fillRect(x+WW*0.96,y-WH+BRD,WW*0.04,bodyH-BRD);
ctx.fillStyle=GOLD2;[0.3,0.6].forEach(f=>{const ry=y-WH+BRD+(bodyH-BRD)*f;ctx.beginPath();ctx.arc(x+WW*0.02,ry,S(1.1),0,7);ctx.fill();ctx.beginPath();ctx.arc(x+WW*0.98,ry,S(1.1),0,7);ctx.fill();});
const botg=ctx.createLinearGradient(x,PLAT_Y-BRD,x,PLAT_Y);botg.addColorStop(0,GOLD3);botg.addColorStop(0.5,GOLD);botg.addColorStop(1,GOLD2);rrFill(x,PLAT_Y-BRD,WW,BRD,S(2),botg);
  const cw=WIN_W,ch=WIN_H,cx2=WIN_X,cy2=WIN_Y;
  if(w.filled){rrFill(cx2,cy2,cw,ch,S(6),'#0a1a08');const inkH=ch*w.fillAnim,inkY=cy2+ch-inkH;ctx.save();ctx.beginPath();ctx.roundRect(cx2,cy2,cw,ch,S(6));ctx.clip();const inkG=ctx.createLinearGradient(cx2,inkY,cx2,cy2+ch);inkG.addColorStop(0,w.color.h);inkG.addColorStop(1,w.color.dark);ctx.fillStyle=inkG;ctx.fillRect(cx2,inkY,cw,inkH);ctx.restore();
ctx.save();ctx.globalAlpha=Math.min(1,w.fillAnim*1.5);
ctx.save();ctx.font=`${Math.min(ch*0.65,cw*0.58)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,0.3)';ctx.shadowBlur=S(3);fillAnimal(w.color,cx2+cw/2,cy2+ch*0.46);ctx.restore();
if(w.fillAnim>0.85){ctx.globalAlpha=(w.fillAnim-0.85)*6.6;ctx.fillStyle='#00e676';ctx.font=`bold ${S(ch*0.3)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✓',cx2+cw*0.78,cy2+ch*0.22);}
ctx.restore();ctx.strokeStyle=GOLD2;ctx.lineWidth=S(2.5);ctx.beginPath();ctx.roundRect(cx2,cy2,cw,ch,S(6));ctx.stroke();}
  else if(locked){rrFill(cx2,cy2,cw,ch,S(6),'#141008');ctx.save();ctx.globalAlpha=0.5;ctx.fillStyle='#998860';ctx.font=`${Math.min(ch*0.5,S(20))}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔒',cx2+cw/2,cy2+ch/2);ctx.restore();}
  else{
    // Fundo com a cor
    const cg=ctx.createLinearGradient(cx2,cy2,cx2+cw,cy2+ch);
    cg.addColorStop(0,w.color.h);cg.addColorStop(1,w.color.dark);
    rrFill(cx2,cy2,cw,ch,S(6),cg);
    // Emoji do animal centrado
    ctx.save();ctx.font=`${Math.min(ch*0.65,cw*0.58)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,0.3)';ctx.shadowBlur=S(3);fillAnimal(w.color,cx2+cw/2,cy2+ch*0.46);ctx.restore();
    ctx.strokeStyle=GOLD2;ctx.lineWidth=S(2.5);ctx.beginPath();ctx.roundRect(cx2,cy2,cw,ch,S(6));ctx.stroke();
  }
  if(!locked){const fnSize=fitText(w.color.name,WW*0.90,Math.min(WH*0.17,S(12)),S(6));ctx.save();ctx.fillStyle=w.filled?'#00e676':GOLD2;ctx.font=`900 ${fnSize}px Fredoka One,cursive`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=S(3);ctx.fillText(w.color.name,x+WW/2,NAME_Y);ctx.restore();}
  rrFill(x-S(2),PLAT_Y,WW+S(4),S(5),S(2),'#1f2026');rrFill(x+WW*0.08,PLAT_Y+S(4),WW*0.84,S(4),S(2),'#2a2c33');
ctx.fillStyle='#2a2c33';ctx.fillRect(x-S(4),PLAT_Y+S(1),S(4),S(3));ctx.fillRect(x+WW,PLAT_Y+S(1),S(4),S(3));
rrFill(x-S(7),PLAT_Y-S(1),S(3),S(7),S(1.5),'#c9ced6');rrFill(x+WW+S(4),PLAT_Y-S(1),S(3),S(7),S(1.5),'#c9ced6');
const wr2=Math.min(WH*0.28,WW*0.14);trainWheel(x+WW*0.20,y,wr2,wheelAngle,'#d8392b');trainWheel(x+WW*0.80,y,wr2,wheelAngle,'#d8392b');
}

  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    const r=cvT.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);
    cvT.width=Math.round(W*dpr);cvT.height=Math.round(H*dpr);
    K=H/185;WW=Math.round(S(104));WH=Math.round(S(60));WG=Math.round(S(8));LW=Math.round(S(138));RAIL_Y=Math.round(H-S(16));
  }
  function rails(){
    const y=RAIL_Y+S(11);
    ctx.fillStyle='rgba(30,27,75,.28)';
    for(let x=-((tt*0.001*speed)%S(22));x<W;x+=S(22))ctx.fillRect(x,y,S(12),S(4));
    ctx.fillStyle='#1e1b4b';ctx.fillRect(0,y-S(1),W,Math.max(2,S(3)));
  }
  const speed=70;let xL=-LW*1.2;
  function drawTrain(){
    const totalW=LW+wagons.length*(WW+WG);
    wagons.forEach((w,i)=>{w.x=xL-(i+1)*(WW+WG);});
    for(let i=0;i<wagons.length;i++){const wx=wagons[i].x+WW,nx=i===0?xL:wagons[i-1].x,cy=RAIL_Y-WH*0.38;ctx.fillStyle='#888';ctx.fillRect(Math.min(wx,nx),cy-S(3),Math.abs(wx-nx),S(6));['#aaa','#999'].forEach((c,ci)=>{const ex=ci===0?wx:nx;rrFill(ex-S(6),cy-S(5),S(12),S(10),S(3),c);ctx.beginPath();ctx.arc(ex,cy,S(4),0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();});}
    for(let i=wagons.length-1;i>=0;i--)drawWagon(wagons[i],i);
    drawLoco(xL);
    return totalW;
  }
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last=0;
  function frame(t){
    const dt=Math.min(50,t-last||16);last=t;tt=t;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    if(!reduce){xL+=speed*dt/1000;wheelAngle+=speed*dt/1000/(LW*0.14);}
    rails();
    updateDrawSmoke();
    const totalW=drawTrain();
    if(xL-wagons.length*(WW+WG)>W+S(20)){xL=-LW*1.2;smokeParticles=[];}
    if(!reduce)requestAnimationFrame(frame);
  }
  function start(){size();if(reduce){xL=W*0.62;}requestAnimationFrame(frame);}
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{size();if(reduce)requestAnimationFrame(frame);},120);});
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start);
})();

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
